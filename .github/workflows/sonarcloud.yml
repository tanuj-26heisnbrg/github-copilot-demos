name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectKey: tanuj-26heisnbrg_github-copilot-demos
          organization: tanuj-26heisnbrg
        env:
          SONAR_TOKEN:  ${{ secrets.SONAR_CLOUD }}







          
